
name: deploy

on:
  push:
    branches:
      - main

concurrency:
  group: pagosya-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      IMAGE: ghcr.io/0ant012/pagosya-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Obtener tag del commit
        id: vars
        run: |
          echo "tag=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Login en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir imagen
        run: |
          docker build \
            --build-arg APP_VERSION=${{ steps.vars.outputs.tag }} \
            -t "$IMAGE:${{ steps.vars.outputs.tag }}" \
            app/

      - name: Iniciar contenedor
        run: |
          docker run -d \
            --name pagosya-api-test \
            -p 8080:8000 \
            "$IMAGE:${{ steps.vars.outputs.tag }}"

      - name: Smoke test
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/; then
              echo "Smoke test OK"
              exit 0
            fi
            sleep 1
          done

          echo "Smoke test fallido"
          docker logs pagosya-api-test
          exit 1

      - name: Publicar imagen en GHCR
        run: |
          docker push "$IMAGE:${{ steps.vars.outputs.tag }}"

      - name: Limpiar contenedor
        if: always()
        run: |
          docker rm -f pagosya-api-test || true
